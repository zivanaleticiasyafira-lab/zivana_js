<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleCalculator</title>
</head>
<body>
    <label>number 1</label><br>
    <input type="number" id="num1" placeholder="Enter Number"><br>
    <label>number 2</label><br>
    <input type="number" id="num2" placeholder="Enter Number"><br>
    
    <button type="button" onclick="toResult('+')">+</button>
    <button type="button" onclick="toResult('-')">-</button>
    <button type="button" onclick="toResult(':')">:</button>
    <button type="button" onclick="toResult('x')">x</button>

  <script>
    function toResult(op){
      let n1 = document.getElementById("num1").value;
      let n2 = document.getElementById("num2").value;
      
      n1 = Number(n1);
      n2 = Number(n2);

      let hasil = 0;

      if(op == '+'){
        hasil = n1 + n2;
      } else if(op == '-'){
        hasil = n1 - n2;
      } else if(op == 'x'){
        hasil = n1 * n2;
      } else if(op == ':'){
        hasil = n1 / n2;
      }

      alert("Hasilnya: " + hasil);
    }
  </script>
</body>
</html>
